services:
  site:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    command: >
      sh -c "echo 'server { listen 3000; root /usr/share/nginx/html; index index.html; location / { try_files $$uri $$uri/ /index.html; } }' > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
